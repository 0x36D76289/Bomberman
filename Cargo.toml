[package]
name = "Bomberman"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = "0.34.1"
rand = "0.10.3"
tobj = "4.0.5"
vulkano = "0.35.2"
vulkano-shaders = "0.35.0"
winit = { version = "0.30.13", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
rodio = "0.22.2"
anyhow = "1.0.104"
gilrs = { version = "0.11.2", features = ["serde-serialize"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9"
ciborium = "0.2.2"
ufbx = "0.11.5"

# needs cargo-bundle
# build with 'cargo bundle'
[package.metadata.bundle]
identifier = "io.github.0x36D76289.Bomberman"
